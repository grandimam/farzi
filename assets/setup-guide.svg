<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#5E6AD2;stop-opacity:0.8" />
    </linearGradient>

    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5E6AD2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4C51BF;stop-opacity:0.8" />
    </linearGradient>

    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4C51BF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#48BB78;stop-opacity:0.8" />
    </linearGradient>

    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="450" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2D3748" text-anchor="middle">
    Farzi Setup in 3 Steps
  </text>

  <text x="450" y="75" font-family="Arial, sans-serif" font-size="14" fill="#718096" text-anchor="middle">
    Get up and running with Claude in minutes
  </text>

  <!-- Step 1: Install -->
  <g transform="translate(50, 120)">
    <rect width="800" height="140" rx="12" fill="url(#stepGrad1)" filter="url(#cardShadow)"/>

    <!-- Step number -->
    <circle cx="40" cy="40" r="25" fill="white"/>
    <text x="40" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#5E6AD2" text-anchor="middle">1</text>

    <!-- Title -->
    <text x="80" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">
      Install Farzi
    </text>

    <text x="80" y="55" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.9">
      Clone the repository and build the MCP server
    </text>

    <!-- Code box -->
    <rect x="80" y="70" width="700" height="55" rx="6" fill="rgba(0,0,0,0.3)"/>

    <text x="95" y="90" font-family="monospace" font-size="12" fill="#48BB78">
      $ git clone https://github.com/grandimam/farzi.git
    </text>

    <text x="95" y="107" font-family="monospace" font-size="12" fill="#48BB78">
      $ cd farzi &amp;&amp; npm install &amp;&amp; npm run build
    </text>
  </g>

  <!-- Step 2: Configure -->
  <g transform="translate(50, 290)">
    <rect width="800" height="200" rx="12" fill="url(#stepGrad2)" filter="url(#cardShadow)"/>

    <!-- Step number -->
    <circle cx="40" cy="40" r="25" fill="white"/>
    <text x="40" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#4C51BF" text-anchor="middle">2</text>

    <!-- Title -->
    <text x="80" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">
      Configure Claude Desktop
    </text>

    <text x="80" y="55" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.9">
      Add Farzi to your MCP servers configuration
    </text>

    <!-- File path -->
    <rect x="80" y="65" width="700" height="20" rx="4" fill="rgba(0,0,0,0.2)"/>
    <text x="95" y="79" font-family="monospace" font-size="11" fill="white">
      ~/Library/Application Support/Claude/claude_desktop_config.json
    </text>

    <!-- Code box -->
    <rect x="80" y="95" width="700" height="90" rx="6" fill="rgba(0,0,0,0.3)"/>

    <text x="95" y="113" font-family="monospace" font-size="11" fill="#CBD5E0">{</text>
    <text x="110" y="129" font-family="monospace" font-size="11" fill="#F687B3">"mcpServers"</text>
    <text x="198" y="129" font-family="monospace" font-size="11" fill="#CBD5E0">: {</text>
    <text x="125" y="145" font-family="monospace" font-size="11" fill="#F687B3">"farzi"</text>
    <text x="175" y="145" font-family="monospace" font-size="11" fill="#CBD5E0">: {</text>
    <text x="140" y="161" font-family="monospace" font-size="11" fill="#F687B3">"command"</text>
    <text x="210" y="161" font-family="monospace" font-size="11" fill="#CBD5E0">:</text>
    <text x="220" y="161" font-family="monospace" font-size="11" fill="#F6AD55">"node"</text>
    <text x="260" y="161" font-family="monospace" font-size="11" fill="#CBD5E0">,</text>
    <text x="140" y="177" font-family="monospace" font-size="11" fill="#F687B3">"args"</text>
    <text x="182" y="177" font-family="monospace" font-size="11" fill="#CBD5E0">: [</text>
    <text x="195" y="177" font-family="monospace" font-size="11" fill="#F6AD55">"/path/to/farzi/dist/mcp-server.js"</text>
    <text x="460" y="177" font-family="monospace" font-size="11" fill="#CBD5E0">]</text>

    <!-- Note -->
    <text x="95" y="175" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.7">
      💡 Use absolute path to mcp-server.js
    </text>
  </g>

  <!-- Step 3: Use It -->
  <g transform="translate(50, 520)">
    <rect width="800" height="130" rx="12" fill="url(#stepGrad3)" filter="url(#cardShadow)"/>

    <!-- Step number -->
    <circle cx="40" cy="40" r="25" fill="white"/>
    <text x="40" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#48BB78" text-anchor="middle">3</text>

    <!-- Title -->
    <text x="80" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">
      Start Using Farzi
    </text>

    <text x="80" y="55" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.9">
      Restart Claude Desktop and start replicating!
    </text>

    <!-- Example usage -->
    <rect x="80" y="70" width="700" height="45" rx="6" fill="rgba(0,0,0,0.3)"/>

    <text x="95" y="88" font-family="monospace" font-size="12" fill="white">
      👤 Clone https://linear.app to ./my-clone
    </text>

    <text x="95" y="105" font-family="monospace" font-size="12" fill="#68D391">
      🤖 [Farzi replicates with 99.7% accuracy] ✨
    </text>
  </g>

  <!-- Bottom note -->
  <text x="450" y="680" font-family="Arial, sans-serif" font-size="12" fill="#718096" text-anchor="middle">
    That's it! See MCP_SETUP.md for detailed configuration options
  </text>
</svg>
