<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#5E6AD2" opacity="0.1"/>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#5E6AD2" stroke-width="2" opacity="0.3"/>

  <!-- Main icon - Replication symbol -->
  <!-- Original frame -->
  <rect x="40" y="50" width="60" height="70" rx="4" fill="none" stroke="#5E6AD2" stroke-width="3"/>
  <line x1="50" y1="65" x2="90" y2="65" stroke="#5E6AD2" stroke-width="2"/>
  <line x1="50" y1="75" x2="80" y2="75" stroke="#5E6AD2" stroke-width="2"/>
  <line x1="50" y1="85" x2="85" y2="85" stroke="#5E6AD2" stroke-width="2"/>
  <line x1="50" y1="95" x2="75" y2="95" stroke="#5E6AD2" stroke-width="2"/>

  <!-- Replica frame (offset and slightly smaller to show depth) -->
  <rect x="100" y="80" width="60" height="70" rx="4" fill="#F6F9FC" stroke="#5E6AD2" stroke-width="3"/>
  <line x1="110" y1="95" x2="150" y2="95" stroke="#5E6AD2" stroke-width="2"/>
  <line x1="110" y1="105" x2="140" y2="105" stroke="#5E6AD2" stroke-width="2"/>
  <line x1="110" y1="115" x2="145" y2="115" stroke="#5E6AD2" stroke-width="2"/>
  <line x1="110" y1="125" x2="135" y2="125" stroke="#5E6AD2" stroke-width="2"/>

  <!-- Connection arrow showing replication -->
  <path d="M 105 85 L 90 70 L 85 75" fill="none" stroke="#5E6AD2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="105" y1="85" x2="90" y2="70" stroke="#5E6AD2" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pixel perfect indicator - small squares at corners -->
  <rect x="38" y="48" width="4" height="4" fill="#5E6AD2"/>
  <rect x="96" y="48" width="4" height="4" fill="#5E6AD2"/>
  <rect x="156" y="146" width="4" height="4" fill="#5E6AD2"/>
  <rect x="98" y="146" width="4" height="4" fill="#5E6AD2"/>

  <!-- Scan lines effect -->
  <line x1="40" y1="55" x2="100" y2="55" stroke="#5E6AD2" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="85" x2="160" y2="85" stroke="#5E6AD2" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="100" x2="160" y2="100" stroke="#5E6AD2" stroke-width="0.5" opacity="0.3"/>

  <!-- Text -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#5E6AD2">FARZI</text>
  <text x="100" y="188" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#89A5C1">PIXEL PERFECT REPLICATION</text>
</svg>
